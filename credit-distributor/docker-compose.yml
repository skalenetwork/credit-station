services:
  credit-distributor:
    image: credit-distributor:latest
    container_name: credit_distributor
    volumes:
      - ./config.toml:/app/config.toml:ro
    build:
      context: .
      dockerfile: Dockerfile
    logging:
      driver: "json-file"
      options:
        max-file: "5"
        max-size: "200m"
    restart: unless-stopped
