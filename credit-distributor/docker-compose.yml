services:
  credit-distributor:
    build: .
    container_name: credit_distributor
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    secrets: [distributor_key]
    volumes:
      - ./config.toml:/etc/credit-distributor/config.toml:ro
      - state:/state
    logging:
      driver: json-file
      options:
        max-size: 200m
        max-file: '5'

secrets:
  distributor_key:
    file: ./distributor_key

volumes:
  state:
