[project]
name = "credit-distributor"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = ["skale.py==8.0dev3", "skale.py-core==8.0dev3", "pydantic==2.14.3"]

[project.scripts]
credit-distributor = "credit_distributor:main"

[dependency-groups]
dev = ["ruff==0.17.5", "mypy==2.4.1", "pytest==9.2.0"]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I"]

[tool.ruff.format]
quote-style = "single"

[tool.mypy]
strict = true
