[project]
name = "credit-distributor"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = ["skale.py==7.14dev5", "skale.py-core==7.14dev5", "pydantic>=2.13,<3"]

[project.scripts]
credit-distributor = "credit_distributor:main"

[dependency-groups]
dev = ["ruff==0.16.9", "mypy==2.3.1", "pytest==9.1.1"]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I"]

[tool.ruff.format]
quote-style = "single"

[tool.mypy]
strict = true
