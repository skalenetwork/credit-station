name: credit-distributor

on:
  push:
    paths:
      - .github/workflows/credit-distributor.yml
      - contracts/**
      - credit-distributor/**

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Set up Node
      uses: actions/setup-node@v6
      with:
        node-version: 24
        cache: 'yarn'

    - name: Start Hardhat node
      run: |
        yarn install
        yarn compile
        yarn hardhat node --port 8547 &
        curl -s --retry 60 --retry-all-errors --retry-delay 1 -H 'Content-Type: application/json' \
          -d '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}' http://127.0.0.1:8547

    - name: Set up uv
      uses: astral-sh/setup-uv@v10.2.0
      with:
        version: '0.12.19'

    - name: Check and test
      working-directory: credit-distributor
      run: |
        uv sync --locked
        uv run ruff check
        uv run ruff format --check
        uv run mypy src tests
        uv run pytest
